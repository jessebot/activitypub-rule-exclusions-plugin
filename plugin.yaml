# OWASP CRS Plugin Descriptor
# See https://github.com/coreruleset/plugin-registry for the schema definition.
#
schema_version: 1

plugin:
  name: "activitypub-rule-exclusions-plugin"
  description: "Rule exclusions plugin for activitypub."
  long_description: |
    Provides targeted rule exclusions to eliminate false positive when running
    OWASP CRS in front of activitypub based software such as GoToSocial
    or Mastodon.
  type: "3rd-party"
  category: "rule-exclusion"
  status: "tested"
  license: "Apache-2.0"
  authors:
    - name: "OWASP CRS Team"
      url: "https://coreruleset.org"
    - name: "JesseBot"
      url: "https://jessebot.work"
    - name: "Open Engineering"
      url: "https://open.engineering"
  repository: "https://github.com/jessebot/activitypub-rule-exclusions-plugin"
  keywords:
    - "activitypub"
    - "rule-exclusions"
    - "fediverse"
    - "mastodon"
    - "gotosocial"
    - "false-positive"

rule_id_range:
  start: 9532000
  end: 9532999

compatibility:
  crs_version: ">=4.0.0"
  # engines is spelled out here, even though the activitypub-rule-exclusions supports all three,
  # to showcase the field for authors copying this file. A real plugin that
  # truly supports every engine should omit `engines` instead: per
  # docs/plugin-descriptor-schema.md, an omitted field already means "all".
  engines:
    - "modsecurity3"
    - "coraza"

configuration:
  file: "plugins/activitypub-rule-exclusions-config.conf"
  variables:
    - name: "tx.activitypub-rule-exclusions-plugin_enabled"
      type: "boolean"
      default: 1
      description: "Enables or disables the activitypub-rule-exclusions plugin (0 to disable)."
      required: false
