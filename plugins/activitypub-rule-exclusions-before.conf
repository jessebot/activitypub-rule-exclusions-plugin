# -----------------------------------------------------------------------------
# allow editing and deleting statuses on mastodon -
# - fixes rule 911100
# - also fixes 932230 because a status/post can be anything, including things
#   that look like Unix injections
# -----------------------------------------------------------------------------
SecRule REQUEST_URI "@beginsWith /api/v1/statuses" \
        "id:9532002,\
        phase:1,\
        ver:'activitypub-exclusions-plugin/1.0.0',\
        pass,\
        nolog,\
        setvar:'tx.allowed_methods=%{tx.allowed_methods} PUT DELETE',\
        ctl:requestBodyProcessor=JSON,\
        ctl:ruleRemoveTargetById=932230;ARGS:json.status,\
        setvar:'tx.allowed_request_content_type=%{tx.allowed_request_content_type} |application/activity+json| |application/ld+json|'"

# -----------------------------------------------------------------------------
# allow searching for statuses - rule 920470 and 920420
# example URI for gotosocial:
# /users/exampleuser/statuses/01M844422MYQG8S8J6D6VO4V8T/replies?page=true&only_other_accounts=false
# TODO,figure out this:
#
#         ctl:ruleRemoveTargetById=920600;REQUEST_HEADERS:Accept-Charset,\
#         ctl:ruleRemoveTargetById=920450;REQUEST_HEADERS_NAMES:Accept-Charset,\
#         ctl:ruleRemoveTargetById=920450;TX.header_name_accept-charset"
#
# see: https://github.com/coreruleset/coreruleset/issues/3497
# -----------------------------------------------------------------------------
SecRule REQUEST_URI "@rx ^/users/[a-zA-Z0-9_\-]+/statuses/[a-zA-Z0-9]+/.*$" \
        "id:9532003,\
        phase:1,\
        ver:'activitypub-exclusions-plugin/1.0.0',\
        pass,\
        nolog,\
        setvar:'tx.allowed_request_content_type=%{tx.allowed_request_content_type} |application/activity+json| |application/ld+json|',\
        ctl:requestBodyProcessor=JSON,\
        ctl:ruleRemoveTargetById=920600;REQUEST_HEADERS,\
        ctl:ruleRemoveTargetById=920450;REQUEST_HEADERS_NAMES"

# -----------------------------------------------------------------------------
# these are both for getting statuses (like if a status is searched for)
# avoids 942100 SQL Injection Attack Detected via libinjection
# ctl:ruleRemoveById=942100,\ <--- this needs to be removed by target
#
#  "rule_name": "920600",
#  "message": "Illegal Accept header: charset parameter",
#  "target_path": "/users/username/statuses/00000000000000000000000000",
#  "matched_zones": "REQUEST_HEADERS.Accept",
#  "data": "application/ld+json; profile=\"https://www.w3.org/ns/activitystreams\",application/activity+json",
#
# Rule Name     │ native_rule:920450
# Target Host   │ social.open.engineering
# Target Path   │ /users/jessebot/statuses/01M84NX6MSZX3AS0PH9YGS10B6
# Message       │ HTTP header is restricted by policy (/accept-charset/)
# Matched Zones │ REQUEST_HEADERS_NAMES.X-Forwarded-Host,REQUEST_HEADERS_NAMES.Signature,REQUEST_HEADERS_NAMES.X-Forwarded-Port,REQUEST_HEADERS_NAMES.Accept,REQUEST_HEADE
# Matched Data  │ Restricted header detected: /accept-charset/
# -----------------------------------------------------------------------------
SecRule REQUEST_URI "@rx ^/@[a-zA-Z0-9_\-]+/statuses/[a-zA-Z0-9]+$" \
        "id:9532004,\
        phase:1,\
        ver:'activitypub-exclusions-plugin/1.0.0',\
        pass,\
        nolog,\
        setvar:'tx.allowed_request_content_type=%{tx.allowed_request_content_type} |application/activity+json| |application/ld+json|',\
        ctl:requestBodyProcessor=JSON,\
        ctl:ruleRemoveTargetById=920600;REQUEST_HEADERS,\
        ctl:ruleRemoveTargetById=920450;REQUEST_HEADERS_NAMES"

# -----------------------------------------------------------------------------
# For sending a message
# avoids 932230 Remote Command Execution: Unix Command Injection
# and 932235 Remote Command Execution: Unix Command Injection
# and 932250 Remote Command Execution: Direct Unix Command Execution
# and 942190 MSSQL code execution and information gathering attempts
# and 931120 Possible Remote File Inclusion (RFI) Attack: URL Payload Used w/Trailing Question Mark Character (?)
# and 932370 Remote Command Execution: Windows Command Injection
# -----------------------------------------------------------------------------
SecRule REQUEST_URI "@rx ^/api/v1/statuses/.*$" \
        "id:9532050,\
        phase:1,\
        ver:'activitypub-exclusions-plugin/1.0.0',\
        pass,\
        nolog,\
        ctl:ruleRemoveById=942190,\
        ctl:ruleRemoveById=932370,\
        ctl:ruleRemoveById=931120,\
        ctl:ruleRemoveById=932250,\
        ctl:ruleRemoveById=932230,\
        ctl:ruleRemoveById=932235"


# -----------------------------------------------------------------------------
