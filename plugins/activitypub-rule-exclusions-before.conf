# -----------------------------------------------------------------------------
# GoToSocial editing profiles
# (endpoint is hit anytime you edit your profile for any field including the bio which accepts HTML)
#
# allow PATCH to change user credentials - rule 911100
#
#  Rule Name     │ 932230
#  Target Path   │ /api/v1/accounts/update_credentials
#  Message       │ Remote Command Execution: Unix Command Injection (2-3 chars)
#  Matched Zones │ ARGS.note
#
# -----------------------------------------------------------------------------
SecRule REQUEST_URI "@streq /api/v1/accounts/update_credentials" \
        "id:9532028,\
        phase:1,\
        ver:'activitypub-exclusions-plugin/1.0.0',\
        pass,\
        nolog,\
        setvar:'tx.allowed_methods=%{tx.allowed_methods} PUT PATCH',\
        ctl:ruleRemoveTargetById=932230;ARGS:note"

