        nolog,\
        setvar:'tx.allowed_methods=%{tx.allowed_methods} PUT PATCH'"

# -----------------------------------------------------------------------------
# allow looking up tags on gotosocial - rules 920470
# -----------------------------------------------------------------------------
SecRule REQUEST_URI "@rx ^/tags/.*$" \
        "id:9532038,\
        phase:1,\
        ver:'activitypub-exclusions-plugin/1.0.0',\
        pass,\
        log,\
        ctl:ruleRemoveById=920470"

# -----------------------------------------------------------------------------
# allow looking up images on gotosocial - rules 920470
# -----------------------------------------------------------------------------
SecRule REQUEST_URI "@rx ^/fileserver/.*/attachment/original/.*$" \
        "id:9532039,\
        phase:1,\
        ver:'activitypub-exclusions-plugin/1.0.0',\
        pass,\
        log,\
        ctl:ruleRemoveById=920470"

# -----------------------------------------------------------------------------
# allow looking up statuses for users on gotosocil - fixes rule 920420
# -----------------------------------------------------------------------------
SecRule REQUEST_URI "@rx ^/%40.*/statuses/.*$" \
        "id:9532040,\
        phase:1,\
        ver:'activitypub-exclusions-plugin/1.0.0',\
        pass,\
        log,\
        setvar:'tx.allowed_request_content_type=%{tx.allowed_request_content_type} |application/activity+json| |application/ld+json| |text/html|'"

# -----------------------------------------------------------------------------
# gotosocial delete emojis
# bypass 911100 - Method is not allowed by policy
# -----------------------------------------------------------------------------
SecRule REQUEST_URI "@rx ^/api/v1/admin/custom_emojis/.*$" \
        "id:9532041,\
        phase:1,\
        ver:'activitypub-exclusions-plugin/1.0.0',\
        pass,\
        nolog,\
        setvar:'tx.allowed_methods=%{tx.allowed_methods} DELETE'"

# -----------------------------------------------------------------------------
# getting a gotosocial profile from mastodon
# bypass 920600 - Illegal Accept header: charset parameter
# because the header has: application/activity+json,\ application/ld+json; profile="https://www.w3.org/ns/activitystreams",\ text/html;q=0.1
# -----------------------------------------------------------------------------
SecRule REQUEST_URI "@rx ^/@[A-Za-z0-9_\-]+$" \
        "id:9532042,\
        phase:1,\
        ver:'activitypub-exclusions-plugin/1.0.0',\
        pass,\
        nolog,\
        ctl:ruleRemoveTargetById=920600;REQUEST_HEADERS,\
        ctl:ruleRemoveTargetById=920450;REQUEST_HEADERS_NAMES,\
        setvar:'tx.allowed_request_content_type=%{tx.allowed_request_content_type} |application/activity+json| |application/ld+json| |text/html|'"

# -----------------------------------------------------------------------------
# For sending a message
# avoids 932230 Remote Command Execution: Unix Command Injection
# and 932235 Remote Command Execution: Unix Command Injection
# and 932250 Remote Command Execution: Direct Unix Command Execution
# and 942190 MSSQL code execution and information gathering attempts
# and 931120 Possible Remote File Inclusion (RFI) Attack: URL Payload Used w/Trailing Question Mark Character (?)
# and 932370 Remote Command Execution: Windows Command Injection
# -----------------------------------------------------------------------------
SecRule REQUEST_URI "@rx ^/api/v1/statuses/.*$" \
        "id:9532050,\
        phase:1,\
        ver:'activitypub-exclusions-plugin/1.0.0',\
        pass,\
        nolog,\
        ctl:ruleRemoveById=942190,\
        ctl:ruleRemoveById=932370,\
        ctl:ruleRemoveById=931120,\
        ctl:ruleRemoveById=932250,\
        ctl:ruleRemoveById=932230,\
        ctl:ruleRemoveById=932235"

# -----------------------------------------------------------------------------
# For sending a report
# avoids 930120 OS File Access Attempt Event:
# -----------------------------------------------------------------------------
SecRule REQUEST_URI "@rx ^/api/v1/reports.*$" \
        "id:9532051,\
        phase:1,\
        ver:'activitypub-exclusions-plugin/1.0.0',\
        pass,\
        nolog,\
        ctl:ruleRemoveById=930120"


SecRule REQUEST_URI "@rx ^/admin/report_notes.*$" \
        "id:9532053,\
        phase:1,\
        ver:'activitypub-exclusions-plugin/1.0.0',\
        pass,\
        nolog,\
        ctl:ruleRemoveById=942190,\
        ctl:ruleRemoveById=942360,\
        ctl:ruleRemoveById=932330,\
        ctl:ruleRemoveById=932250,\
        ctl:ruleRemoveById=932230,\
        ctl:ruleRemoveById=932235"

# -----------------------------------------------------------------------------
# For signins
# -----------------------------------------------------------------------------
SecRule REQUEST_URI "@rx ^/auth/sign_in.*$" \
        "id:9532052,\
        phase:1,\
        ver:'activitypub-exclusions-plugin/1.0.0',\
        pass,\
        nolog,\
        ctl:ruleRemoveById=942190,\
        ctl:ruleRemoveById=932330,\
        ctl:ruleRemoveById=932250,\
        ctl:ruleRemoveById=932230,\
        ctl:ruleRemoveById=932235"

# --------------------------------------------------------------------------
# Allow looking at suspension data
# 920440 URL file extension is restricted by policy
# --------------------------------------------------------------------------
SecRule REQUEST_URI "@rx ^/admin/instances.*$" \
        "id:9532054,\
        phase:1,\
        ver:'activitypub-exclusions-plugin/1.0.0',\
        pass,\
        nolog,\
        ctl:ruleRemoveById=920440"

# -----------------------------------------------------------------------------
# There's not a great way to deal with https://www.w3.org/TR/json-ld/#application-ld-json yet
# but another kind OWASP CRS maintainer suggested the following. See:
# https://github.com/coreruleset/coreruleset/issues/3605#issuecomment-1986094331
# -----------------------------------------------------------------------------
SecRule REQUEST_HEADERS:Content-Type "@streq application/ld+json; profile=\"https://www.w3.org/ns/activitystreams\"" \
    "id:9532058,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ctl:ruleRemoveTargetById=920470;REQUEST_HEADERS:Content-Type"

SecRule REQUEST_HEADERS:Accept "@contains application/ld+json; profile=\"https://www.w3.org/ns/activitystreams\"" \
    "id:9532059,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ctl:ruleRemoveTargetById=920600;REQUEST_HEADERS:Accept"

# ──────────────────────────────────────────────
# ┏━┓╺┳╸┏━┓┏━┓┏━┓┏━╸┏━╸
# ┗━┓ ┃ ┃ ┃┣┳┛┣━┫┃╺┓┣╸
# ┗━┛ ╹ ┗━┛╹┗╸╹ ╹┗━┛┗━╸
# ──────────────────────────────────────────────

# -----------------------------------------------------------------------------
# This one was a really toughy,\ but sometimes headers will contain the word if which triggers 920450, so we have to reorient the tx.restricted_headers_basic var
# example of blocked request:
#   "request_Signature": "keyId=\"https://some-fedi-instance.tld/users/redacteduser/main-key\",algorithm=\"hs2019\",headers=\"(request-target) host date\",signature=\"\"",
# they also will likely hit the following:
# Rule: native_rule:920450
# Target Host: fied.example.tld
# Target path: /users/exampleuser/main-key
# Message: HTTP header is restricted by policy (/accept-charset/)
# Matched Zones: REQUEST_HEADERS_NAMES.Date,REQUEST_HEADERS_NAMES.X-Forwarded-Port,REQUEST_HEADERS_NAMES.Content-Length,REQUEST_HEADERS_NAMES.Host,REQUEST_HEADERS_NAMES.X-Forwarded-Host,REQUEST_HEADERS_NAMES.X-Real-Ip,REQUEST_HEADERS_NAMES.Accept,REQUEST_HEADERS_NAMES.Signature,REQUEST_HEADERS_NAMES.X-Forwarded-Proto,REQUEST_HEADERS_NAMES.X-Forwarded-Server,REQUEST_HEADERS_NAMES.User-Agent,REQUEST_HEADERS_NAMES.Accept-Encoding,REQUEST_HEADERS_NAMES.Accept-Charset,TX.header_name_accept-charset
# Data: Restricted header detected: /accept-charset/
# I don't know how to disable tx.restricted_headers_extended though, so I allow a bypass on this rule
# -----------------------------------------------------------------------------
SecRule REQUEST_URI "@rx /users/[a-zA-Z0-9_\-]+/main-key" \
        "id:9532057,\
        phase:1,\
        ver:'activitypub-exclusions-plugin/1.0.0',\
        pass,\
        nolog,\
        chain"
        SecRule REQUEST_METHOD "@streq GET" \
            "t:none,\
            ctl:ruleRemoveTargetById=920450;REQUEST_HEADERS_NAMES"

# -----------------------------------------------------------------------------
# avoids rule 920420 :Request content type is not allowed by policy
# this is actually for S3 to be able to support GoToSocial
# S3 enabled bucket lookups for images (Uploads)
# -----------------------------------------------------------------------------
SecRule REQUEST_URI "@rx ^/.*/.*/(?:attachment|emoji)/(?:static|small|original|)/.*$" \
        "id:9532005,\
        phase:1,\
        ver:'activitypub-exclusions-plugin/1.0.0',\
        pass,\
        nolog,\
        setvar:'tx.allowed_request_content_type=%{tx.allowed_request_content_type} |application/activity+json| |image/png| |image/jpg| |image/jpeg| |image/webp| |image/gif| |video/mpeg| |video/mp4| |video/webm| |video/quicktime| |image/apng| |application/octet-stream| |audio/mpeg|',\
        ctl:ruleRemoveById=911100,\
        ctl:ruleRemoveById=920340"
