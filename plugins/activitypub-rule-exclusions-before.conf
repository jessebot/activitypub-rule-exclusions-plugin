        pass,\
        nolog,\
        setvar:'tx.allowed_request_content_type=%{tx.allowed_request_content_type} |application/activity+json| |application/ld+json|',\
        setvar:'tx.allowed_methods=%{tx.allowed_methods} PUT'"

# -----------------------------------------------------------------------------
# allow PATCH to change user credentials - rule 911100
