        nolog,\
        setvar:'tx.allowed_methods=%{tx.allowed_methods} PUT DELETE'"

# -----------------------------------------------------------------------------
# allow editing lists in mastodon
# -----------------------------------------------------------------------------
SecRule REQUEST_URI "@beginsWith /api/v1/lists" \
        "id:9532024,\
        phase:1,\
        ver:'activitypub-exclusions-plugin/1.0.0',\
        pass,\
        nolog,\
        setvar:'tx.allowed_methods=%{tx.allowed_methods} PUT DELETE'"

# -----------------------------------------------------------------------------
