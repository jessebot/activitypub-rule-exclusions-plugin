#
# This also allows for getting a user's profile's followers and following for follow requests
# -----------------------------------------------------------------------------
SecRule REQUEST_URI "@rx ^/(?:users|accounts)/[a-zA-Z0-9_\-]+/(?:inbox|outbox|following|followers|collections/featured)$" \
        "id:9532056,\
        phase:1,\
        ver:'activitypub-exclusions-plugin/1.0.0',\
        pass,\
        log,\
        setvar:'tx.allowed_request_content_type=%{tx.allowed_request_content_type} |application/activity+json| |application/ld+json| |text/html|',\
