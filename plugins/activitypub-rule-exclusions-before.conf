# OWASP CRS Plugin
# Plugin name: activitypub-rule-exclusion-plugin
# Plugin description: Community Rule Exclusion plugin to allow list legit activitypub traffic.
# Rule ID block base: 9,532,000 (range is 1000, thus ID block base +1000)
# Plugin version: 1.0.0

# Generic rule to disable plugin
SecRule TX:activitypub-rule-exclusion-plugin_enabled "@eq 0" \
        "id:9532099,\
        phase:1,\
        pass,\
        nolog,\
        ctl:ruleRemoveById=9532100-9532999"

# -----------------------------------------------------------------------------
# rule 9,532,000 - 9,532,999:
# Detect ARGS activitypub-rule-exclusion-plugin-test-parameter and trigger alert if hit
# -----------------------------------------------------------------------------
SecRule ARGS:activitypub-rule-exclusion-plugin-test-parameter "@rx ." \
	"id:9532100,\
	phase:2,\
	block,\
	t:none,\
	msg:'Detected presence of parameter activitypub-rule-exclusion-plugin-test-parameter',\
	logdata:'%{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
	tag:'application-multi',\
	tag:'language-multi',\
	tag:'platform-multi',\
	tag:'attack-protocol',\
	tag:'paranoia-level/1',\
	tag:'OWASP_CRS',\
	tag:'capec/FIXME',\
	tag:'activitypub-rule-exclusion-plugin',\
        ver:'activitypub-rule-exclusion-plugin/1.0.0',\
	severity:'CRITICAL',\
	setvar:'tx.anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# -----------------------------------------------------------------------------
# [ Local CRS initialization ]
#
# We need to initialize some of the CRS variables also here because plugin
# setup runs before CRS initialization (this is a known limitation of the
# current plugin architecture). Must be kept in sync with CRS default setting.
# -----------------------------------------------------------------------------

# Copy of CRS rule 901160.
SecRule &TX:allowed_methods "@eq 0" \
    "id:9532101,\
    phase:1,\
    pass,\
    nolog,\
    ver:'activitypub-rule-exclusions-plugin/1.0.0',\
    setvar:'tx.allowed_methods=GET HEAD POST OPTIONS'"


# Copy of CRS rule 901162.
SecRule &TX:allowed_request_content_type "@eq 0" \
    "id:9532102,\
    phase:1,\
    pass,\
    nolog,\
    ver:'activitypub-rule-exclusions-plugin/1.0.0',\
    setvar:'tx.allowed_request_content_type=|application/x-www-form-urlencoded| |multipart/form-data| |text/xml| |application/xml| |application/soap+xml| |application/json|'"

# -----------------------------------------------------------------------------
# Allow posting to mastodon inbox - rules 920420, 920470
# rule 920420 :Request content type is not allowed by policy
# also bypasses rule 920600 and 920420
# -----------------------------------------------------------------------------
SecRule REQUEST_URI "@rx ^/(?:inbox|actor)/[a-zA-Z0-9_\-]+$" \
        "id:9532000,\
        phase:1,\
        ver:'activitypub-exclusions-plugin/1.0.0',\
        pass,\
        log,\
        ctl:ruleRemoveById=920420,\
        ctl:ruleRemoveById=920470,\
        ctl:ruleRemoveTargetById=920600;REQUEST_HEADERS,\
        ctl:ruleRemoveTargetById=920450;REQUEST_HEADERS_NAMES"

# -----------------------------------------------------------------------------
# contacting users
# fixes rule 920420
# -----------------------------------------------------------------------------
SecRule REQUEST_URI "@eq /inbox" \
        "id:9532055,\
        phase:1,\
        ver:'activitypub-exclusions-plugin/1.0.0',\
        pass,\
        log,\
        setvar:'tx.allowed_request_content_type=%{tx.allowed_request_content_type} |application/activity+json| |application/ld+json| |text/html|'"

# -----------------------------------------------------------------------------
# contacting users
# fixes rule 920420
# -----------------------------------------------------------------------------
SecRule REQUEST_URI "@rx ^/(?:users|accounts)/[a-zA-Z0-9_\-]+/(?:inbox|outbox)/.*" \
        "id:9532001,\
        phase:1,\
        ver:'activitypub-exclusions-plugin/1.0.0',\
        pass,\
        log,\
        ctl:requestBodyProcessor=JSON,\
        setvar:'tx.allowed_request_content_type=%{tx.allowed_request_content_type} |application/activity+json| |application/ld+json| |text/html|'"

# -----------------------------------------------------------------------------
# sharkey or mastodon or gotosocial contacting users
# avoid rule 920450, header is accept-charset which is excepted
# -----------------------------------------------------------------------------
SecRule REQUEST_URI "@rx ^/(?:users|accounts)/[a-zA-Z0-9_\-]+/(?:inbox|outbox|following)$" \
        "id:9532056,\
        phase:1,\
        ver:'activitypub-exclusions-plugin/1.0.0',\
        pass,\
        log,\
        setvar:'tx.allowed_request_content_type=%{tx.allowed_request_content_type} |application/activity+json| |application/ld+json| |text/html|',\
        ctl:ruleRemoveTargetById=920450;REQUEST_HEADERS_NAMES"

# -----------------------------------------------------------------------------
# allow editing and deleting statuses on mastodon -
# - fixes rule 911100
# -----------------------------------------------------------------------------
SecRule REQUEST_URI "@beginsWith /api/v1/statuses" \
        "id:9532002,\
        phase:1,\
        ver:'activitypub-exclusions-plugin/1.0.0',\
        pass,\
        nolog,\
        setvar:'tx.allowed_methods=%{tx.allowed_methods} PUT DELETE'"

# -----------------------------------------------------------------------------
# allow searching for statuses - rule 920470 and 920420
# example URI for gotosocial:
# /users/exampleuser/statuses/01M844422MYQG8S8J6D6VO4V8T/replies?page=true&only_other_accounts=false
# TODO,figure out this:
#
#         ctl:ruleRemoveTargetById=920600;REQUEST_HEADERS:Accept-Charset,\
#         ctl:ruleRemoveTargetById=920450;REQUEST_HEADERS_NAMES:Accept-Charset,\
#         ctl:ruleRemoveTargetById=920450;TX.header_name_accept-charset"
#
# see: https://github.com/coreruleset/coreruleset/issues/3497
# -----------------------------------------------------------------------------
SecRule REQUEST_URI "@rx ^/users/[a-zA-Z0-9_\-]+/statuses/[A-Z0-9]+/.*$" \
        "id:9532003,\
        phase:1,\
        ver:'activitypub-exclusions-plugin/1.0.0',\
        pass,\
        nolog,\
        setvar:'tx.allowed_request_content_type=%{tx.allowed_request_content_type} |application/activity+json| |application/ld+json|',\
        ctl:requestBodyProcessor=JSON,\
        ctl:ruleRemoveTargetById=920600;REQUEST_HEADERS,\
        ctl:ruleRemoveTargetById=920450;REQUEST_HEADERS_NAMES"

# -----------------------------------------------------------------------------
# these are both for getting statuses (like if a status is searched for)
# avoids 942100 SQL Injection Attack Detected via libinjection
#
#  "rule_name": "920600",
#  "message": "Illegal Accept header: charset parameter",
#  "target_path": "/users/username/statuses/00000000000000000000000000",
#  "matched_zones": "REQUEST_HEADERS.Accept",
#  "data": "application/ld+json; profile=\"https://www.w3.org/ns/activitystreams\",application/activity+json",
# -----------------------------------------------------------------------------
SecRule REQUEST_URI "@rx ^/@.*/statuses/.*$" \
        "id:9532004,\
        phase:1,\
        ver:'activitypub-exclusions-plugin/1.0.0',\
        pass,\
        nolog,\
        ctl:ruleRemoveById=942100,\
        ctl:ruleRemoveTargetById=920600;REQUEST_HEADERS,\
        ctl:ruleRemoveTargetById=920450;REQUEST_HEADERS_NAMES"

# -----------------------------------------------------------------------------
# Request content type is not allowed by policy
# removing rule from mastodon because attachments can be almost anything
# -----------------------------------------------------------------------------
SecRule REQUEST_URI "@rx .mastodon/cache/(?:preview_cards|media_attachments|accounts|custom_emojis)/(?:images|files|avatars|headers).*$" \
        "id:9532006,\
        phase:1,\
        ver:'activitypub-exclusions-plugin/1.0.0',\
        pass,\
        nolog,\
        setvar:'tx.allowed_request_content_type=%{tx.allowed_request_content_type} |application/activity+json| |image/png| |image/jpg| |image/jpeg| |image/webp| |image/gif| |video/mpeg| |video/mp4| |video/webm| |image/apng| |application/octet-stream| |audio/mpeg|'"

# -----------------------------------------------------------------------------
# Same as above for for things not in cache
# Request content type is not allowed by policy
# removing rule from mastodon because attachments can be almost anything
# allow editing and deleting media_attachments
# /mastodon/media_attachments/files/*.fileending
#
# might also need to allow:
#     ctl:ruleRemoveById=911100,\
#     ctl:ruleRemoveById=920340"
# -----------------------------------------------------------------------------
SecRule REQUEST_URI "@rx ^.mastodon/(?:preview_cards|media_attachments|accounts|custom_emojis)/(?:images|thumbnails|files|avatars|headers).*$" \
        "id:9532007,\
        phase:1,\
        ver:'activitypub-exclusions-plugin/1.0.0',\
        pass,\
        nolog,\
        setvar:'tx.allowed_request_content_type=%{tx.allowed_request_content_type} |application/activity+json| |image/png| |image/jpg| |image/jpeg| |image/webp| |image/gif| |video/mpeg| |video/mp4| |video/webm| |video/quicktime| |image/apng| |application/octet-stream| |audio/mpeg|',\
        setvar:'tx.allowed_methods=%{tx.allowed_methods} PUT DELETE'"

# -----------------------------------------------------------------------------
# Ignore "Illegal Accept header: charset parameter" for gotosocial profiles
# Rule: 920600 - see: https://github.com/coreruleset/coreruleset/issues/3497
# -----------------------------------------------------------------------------
# Also allow users to upload content
# -----------------------------------------------------------------------------
SecRule REQUEST_URI "@rx /users/[a-zA-Z0-9_\-]+$" \
        "id:9532009,\
        phase:1,\
        ver:'activitypub-exclusions-plugin/1.0.0',\
        pass,\
        nolog,\
        ctl:ruleRemoveTargetById=920600;REQUEST_HEADERS,\
        ctl:ruleRemoveTargetById=920450;REQUEST_HEADERS_NAMES,\
        ctl:requestBodyProcessor=JSON,\
        setvar:'tx.allowed_request_content_type=%{tx.allowed_request_content_type} |application/activity+json| |image/png| |image/jpg| |image/jpeg| |image/webp| |image/gif| |video/mpeg| |video/mp4| |video/webm| |video/quicktime| |image/apng| |application/octet-stream| |audio/mpeg|'"

# -----------------------------------------------------------------------------
# Allow commenting on mastodon posts, bypasses rule 920600.
# -----------------------------------------------------------------------------
SecRule REQUEST_URI "@rx ^/@[a-zA-Z0-9_\-]+/.*$" \
        "id:9532013,\
        phase:1,\
        ver:'activitypub-exclusions-plugin/1.0.0',\
        pass,\
        nolog,\
        ctl:ruleRemoveTargetById=920600;REQUEST_HEADERS,\
        ctl:ruleRemoveTargetById=920450;REQUEST_HEADERS_NAMES"

# -----------------------------------------------------------------------------
# allow users to view their own account
# -----------------------------------------------------------------------------
SecRule REQUEST_URI "@rx ^/(?:users|accounts)/.*/views.*" \
        "id:9532016,\
        phase:1,\
        ver:'activitypub-exclusions-plugin/1.0.0',\
        pass,\
        log,\
        setvar:'tx.allowed_request_content_type=%{tx.allowed_request_content_type} |application/activity+json| |application/ld+json| |text/html|'"

# -----------------------------------------------------------------------------
# allow users to sign out
# -----------------------------------------------------------------------------
SecRule REQUEST_URI "@streq /auth/sign_out" \
        "id:9532017,\
        phase:1,\
        ver:'activitypub-exclusions-plugin/1.0.0',\
        pass,\
        log,\
        setvar:'tx.allowed_methods=%{tx.allowed_methods} DELETE'"

# -----------------------------------------------------------------------------
# allow editing alt text on images on mastodon - rule 911100
# avoid false-flag Remote Command Execution: Unix Command Injection - rule 932235
# and Remote Command Execution: Unix Command Injection -- rule 932230
# and Remote Command Execution: Direct Unix Command Execution -- rule 932250
# -----------------------------------------------------------------------------
SecRule REQUEST_URI "@beginsWith /api/v1/media" \
        "id:9532019,\
        phase:1,\
        ver:'activitypub-exclusions-plugin/1.0.0',\
        pass,\
        nolog,\
        ctl:ruleRemoveById=932235,\
        ctl:ruleRemoveById=932230,\
        ctl:ruleRemoveById=932250,\
        setvar:'tx.allowed_methods=%{tx.allowed_methods} PUT'"

# -----------------------------------------------------------------------------
# Allow PUT method to mastodon /api/web/settings. This is a GlitchSoc endpoint that tracks your
# most-used emojis/languages for the picker dropdown.
# See: https://github.com/search?q=repo%3Aglitch-soc%2Fmastodon+frequentlyUsedEmojis&type=code
# -----------------------------------------------------------------------------
SecRule REQUEST_URI "@beginsWith /api/web/settings" \
        "id:9532020,\
        phase:1,\
        ver:'activitypub-exclusions-plugin/1.0.0',\
        pass,\
        nolog,\
        setvar:'tx.allowed_methods=%{tx.allowed_methods} PUT'"

# -----------------------------------------------------------------------------
## GoToSocial needs this for it's S3 stuff
