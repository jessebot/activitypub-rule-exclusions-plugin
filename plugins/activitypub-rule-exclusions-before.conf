# OWASP CRS Plugin
# Plugin name: activitypub-rule-exclusion-plugin
# Plugin description: Community Rule Exclusion plugin to allow list legit activitypub traffic.
# Rule ID block base: 9,532,000 (range is 1000, thus ID block base +1000)
# Plugin version: 1.0.0

# Generic rule to disable plugin
SecRule TX:activitypub-rule-exclusion-plugin_enabled "@eq 0" \
        "id:9532099,\
        phase:1,\
        pass,\
        nolog,\
        ctl:ruleRemoveById=9532100-9532999"

# -----------------------------------------------------------------------------
# rule 9,532,000 - 9,532,999:
# Detect ARGS activitypub-rule-exclusion-plugin-test-parameter and trigger alert if hit
# -----------------------------------------------------------------------------
SecRule ARGS:activitypub-rule-exclusion-plugin-test-parameter "@rx ." \
	"id:9532100,\
	phase:2,\
	block,\
	t:none,\
	msg:'Detected presence of parameter activitypub-rule-exclusion-plugin-test-parameter',\
	logdata:'%{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
	tag:'application-multi',\
	tag:'language-multi',\
	tag:'platform-multi',\
	tag:'attack-protocol',\
	tag:'paranoia-level/1',\
	tag:'OWASP_CRS',\
	tag:'capec/FIXME',\
	tag:'activitypub-rule-exclusion-plugin',\
        ver:'activitypub-rule-exclusion-plugin/1.0.0',\
	severity:'CRITICAL',\
	setvar:'tx.anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# -----------------------------------------------------------------------------
# [ Local CRS initialization ]
#
# We need to initialize some of the CRS variables also here because plugin
# setup runs before CRS initialization (this is a known limitation of the
# current plugin architecture). Must be kept in sync with CRS default setting.
# -----------------------------------------------------------------------------

# Copy of CRS rule 901160.
SecRule &TX:allowed_methods "@eq 0" \
    "id:9532101,\
    phase:1,\
    pass,\
    nolog,\
    ver:'activitypub-rule-exclusions-plugin/1.0.0',\
    setvar:'tx.allowed_methods=GET HEAD POST OPTIONS'"


# Copy of CRS rule 901162.
SecRule &TX:allowed_request_content_type "@eq 0" \
    "id:9532102,\
    phase:1,\
    pass,\
    nolog,\
    ver:'activitypub-rule-exclusions-plugin/1.0.0',\
    setvar:'tx.allowed_request_content_type=|application/x-www-form-urlencoded| |multipart/form-data| |text/xml| |application/xml| |application/soap+xml| |application/json|'"

# -----------------------------------------------------------------------------
# There's not a great way to deal with https://www.w3.org/TR/json-ld/#application-ld-json
# yet but another kind OWASP CRS maintainer suggested the following. See:
# https://github.com/coreruleset/coreruleset/issues/3605#issuecomment-1986094331
#
# This allows Content-Type and Accept to be:
# application/ld+json; profile=\"https://www.w3.org/ns/activitystreams\"
#
# It also allows Accept-CharSet
# -----------------------------------------------------------------------------
SecRule REQUEST_HEADERS:Content-Type "@streq application/ld+json; profile=\"https://www.w3.org/ns/activitystreams\"" \
    "id:9532058,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ctl:ruleRemoveTargetById=920470;REQUEST_HEADERS:Content-Type,\
    chain"
    SecRule REQUEST_HEADERS:Accept-Charset "@eq utf-8" \
        "t:none,\
        ctl:ruleRemoveTargetById=920450;REQUEST_HEADERS_NAMES:Accept-Charset"

SecRule REQUEST_HEADERS:Accept "@contains application/ld+json; profile=\"https://www.w3.org/ns/activitystreams\"" \
    "id:9532059,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ctl:ruleRemoveTargetById=920450;REQUEST_HEADERS_NAMES:Accept,\
    ctl:ruleRemoveTargetById=920450;REQUEST_HEADERS:Accept,\
    ctl:ruleRemoveTargetById=920600;REQUEST_HEADERS:Accept,\
    chain"
    SecRule REQUEST_HEADERS:Accept-Charset "@eq utf-8" \
        "t:none,\
        ctl:ruleRemoveTargetById=920450;REQUEST_HEADERS_NAMES:Accept-Charset"

# GoToSocial specifcally serves a robots.txt that gets crawled by other fedi instances
# see: https://docs.gotosocial.org/en/latest/admin/robots/
SecRule REQUEST_FILENAME "@streq /robots.txt" \
    "id:9532060,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ctl:ruleRemoveTargetById=920450;REQUEST_HEADERS_NAMES:Accept,\
    ctl:ruleRemoveTargetById=920450;REQUEST_HEADERS:Accept,\
    chain"
    SecRule REQUEST_METHOD "@streq GET" \
        "t:none,\
        chain"
        SecRule REQUEST_HEADERS:Accept-Charset "@contains utf-8" \
            "t:none,\
            ctl:ruleRemoveTargetById=920450;REQUEST_HEADERS_NAMES:Accept-Charset"

# -----------------------------------------------------------------------------
# This one was a really toughy,\ but sometimes headers will contain the word if which triggers 920450, so we have to reorient the tx.restricted_headers_basic var
# example of blocked request:
#   "request_Signature": "keyId=\"https://some-fedi-instance.tld/users/redacteduser/main-key\",algorithm=\"hs2019\",headers=\"(request-target) host date\",signature=\"\"",
# they also will likely hit the following:
# Rule: native_rule:920450
# Target Host: fied.example.tld
# Target path: /users/exampleuser/main-key
# Message: HTTP header is restricted by policy (/accept-charset/)
# Matched Zones: REQUEST_HEADERS_NAMES.Date,REQUEST_HEADERS_NAMES.X-Forwarded-Port,REQUEST_HEADERS_NAMES.Content-Length,REQUEST_HEADERS_NAMES.Host,REQUEST_HEADERS_NAMES.X-Forwarded-Host,REQUEST_HEADERS_NAMES.X-Real-Ip,REQUEST_HEADERS_NAMES.Accept,REQUEST_HEADERS_NAMES.Signature,REQUEST_HEADERS_NAMES.X-Forwarded-Proto,REQUEST_HEADERS_NAMES.X-Forwarded-Server,REQUEST_HEADERS_NAMES.User-Agent,REQUEST_HEADERS_NAMES.Accept-Encoding,REQUEST_HEADERS_NAMES.Accept-Charset,TX.header_name_accept-charset
# Data: Restricted header detected: /accept-charset/
# I don't know how to disable tx.restricted_headers_extended though, so I allow a bypass on this rule
# -----------------------------------------------------------------------------
SecRule REQUEST_URI "@rx /users/[a-zA-Z0-9_\-]+/main-key" \
        "id:9532057,\
        phase:1,\
        ver:'activitypub-exclusions-plugin/1.0.0',\
        pass,\
        nolog,\
        chain"
        SecRule REQUEST_METHOD "@streq GET" \
            "t:none,\
            ctl:ruleRemoveTargetById=920450;REQUEST_HEADERS_NAMES"

# -----------------------------------------------------------------------------
# contacting users
# fixes rule 920420
# -----------------------------------------------------------------------------
SecRule REQUEST_URI "@eq /inbox" \
        "id:9532055,\
        phase:1,\
        ver:'activitypub-exclusions-plugin/1.0.0',\
        pass,\
        log,\
        ctl:requestBodyProcessor=JSON,\
        setvar:'tx.allowed_request_content_type=%{tx.allowed_request_content_type} |application/activity+json| |application/ld+json| |text/html|'"

# -----------------------------------------------------------------------------
# contacting users
# fixes rule 920420
# -----------------------------------------------------------------------------
SecRule REQUEST_URI "@rx ^/(?:users|accounts)/[a-zA-Z0-9_\-]+/(?:inbox|outbox)/.*" \
        "id:9532001,\
        phase:1,\
        ver:'activitypub-exclusions-plugin/1.0.0',\
        pass,\
        log,\
        ctl:requestBodyProcessor=JSON,\
        setvar:'tx.allowed_request_content_type=%{tx.allowed_request_content_type} |application/activity+json| |application/ld+json| |text/html|'"

# -----------------------------------------------------------------------------
# Allow posting to mastodon inbox
# rule 920420 :Request content type is not allowed by policy
#
# TODO: use target rule for for:
# ctl:ruleRemoveById=920420,\
# ctl:ruleRemoveById=920470,\
# -----------------------------------------------------------------------------
SecRule REQUEST_URI "@rx ^/(?:inbox|actor)/[a-zA-Z0-9_\-]+$" \
        "id:9532000,\
        phase:1,\
        ver:'activitypub-exclusions-plugin/1.0.0',\
        pass,\
        log,\
        ctl:ruleRemoveById=920420,\
        ctl:ruleRemoveById=920470,\
        ctl:ruleRemoveTargetById=920600;REQUEST_HEADERS,\
        ctl:ruleRemoveTargetById=920450;REQUEST_HEADERS_NAMES"

# -----------------------------------------------------------------------------
# All the json allowances are for the POST method
#
# This is because markdown and HTML is allowed in messages in the fediverse
# -----------------------------------------------------------------------------

SecRule REQUEST_URI "@rx ^/users/[a-zA-Z0-9_\-]+/inbox$" \
        "id:9532008,\
        phase:1,\
        ver:'activitypub-exclusions-plugin/1.0.0',\
        pass,\
        nolog,\
        chain"
        SecRule REQUEST_METHOD "@eq POST" \
            "t:none,\
            ctl:ruleRemoveTargetById=930120;ARGS:json.object,\
            ctl:ruleRemoveTargetById=930120;ARGS:json.object.context,\
            ctl:ruleRemoveTargetById=941310;ARGS:json.object.contentMap.zh-CN,\
            ctl:ruleRemoveTargetById=933120;ARGS:json.object.shares.id,\
            ctl:ruleRemoveTargetById=932120;ARGS:json.object.source.content,\
            ctl:ruleRemoveTargetById=932125;ARGS:json.object.source.content,\
            ctl:ruleRemoveTargetById=932230;ARGS:json.object.source.content,\
            ctl:ruleRemoveTargetById=932235;ARGS:json.object.source.content,\
            ctl:ruleRemoveTargetById=932260;ARGS:json.object.source.content,\
            ctl:ruleRemoveTargetById=932370;ARGS:json.object.source.content,\
            ctl:ruleRemoveTargetById=932260;ARGS:json.signature.signatureValue,\
            ctl:ruleRemoveTargetById=933120;ARGS:json.to"

# -----------------------------------------------------------------------------
# This is where we put more complicated exceptions for the inbox
#
# for 933120, example:
# Matched Data: engine found within MATCHED_VARS:ARGS:json.object.replies.first.next:
# https:/example.tld/users/username/statuses/000000000000000000/replies?only_other_accounts=true&page=true
#
# for 930120, example:
# "data": "Matched Data: .env found within ARGS:json.object: https:/example.envs.net/objects/00000000-oo0o-xx0x-8309-000000f2fdxe",
# because users can send URLs to eachother as well, and .envs.net is a common URL
#
# 942360 and 932235 also gets matched on alt text (fedi is nerdy and talks and posts about all sorts of weird things):
#  "data": "Matched Data: y as seen from found within ARGS:json.object.attachment.0.name: A knob reaching up to the sky as seen from a mountain ridge with some sparse evergreens. The knob is made from smooth and slick granite with verticals all around but a rounded top, on side has a total 90% drop off.",
#  "data": "Matched Data: \n\ncurl found within ARGS:json.object.attachment.0.name: HTTP, HTTPS, FTP, FTPS, SFTP, SCP, TFTP, LDAP, LDAPS, DICT, TELNET, FILE, IMAP, IMAPS, POP3, POP3S, SMTP, SMTPS, RTSP, RTMP, GOPHER, GOPHERS, SMB, SMBS, MQTT, WS, WSS...\n\ncurl has grown ...",

#
# 933120 can sometimes match a valid signature which is common with fedi
#  "data": "Matched Data: SMTP found within MATCHED_VARS:ARGS:json.signature.signatureValue: ",
#
# 932250 can be matched on licensing info from misskey
# "data": "Matched Data: CC  found within ARGS:json.object.tag.1._misskey_license.freeText: CC BY-NC-SA 4.0",
#
# 920270 can be matched on image blur hashes from mastodon:
# "data": "ARGS:json.object.attachment.0.blurhash=U3BfkRM}ObjF4;%1?b-V9tE2$d9a~W\u0000Lt6",
# example for json.object.content and json.object.contentMap.en during posts:
# <p>don&#39 t mind me i&#39 m just using fedi like I should </p><p>haha...</p><p>(aren&#39 and didn&#39 .)</p>
# <p><span class=h-card translate=no><a href=https://test.tld/@exampleuser class=u-urlmention>@<span>exampleuser</span></a></span> </p><p>thank you. i&#39
#
# Some of the previous rule examples:
# ctl:ruleRemoveTargetById=941310;ARGS:json.object.tag.1.href,\
# ctl:ruleRemoveTargetById=941310;ARGS:json.object.tag.1.name,\
#
# These are for glitchsoc mastodon flavor:
# ctl:ruleRemoveTargetById=933120;ARGS:/^json.object.formerRepresentations.orderedItems.\d+.content$/,\
# ctl:ruleRemoveTargetById=933120;ARGS:/^json.object.formerRepresentations.orderedItems.\d+.contentmap.[a-z][a-z]$/,\
#
# Another example:
# OS File Access Attempt
# Matched Zones: ARGS.json.object.inReplyToAtomUri
# Matched Data: .env found within ARGS:json.object.inReplyToAtomUri: https://example.envs.tld/objects/00000000-x000-0000-x00x-00x00x000x0x
# -----------------------------------------------------------------------------
SecRule REQUEST_FILENAME "@rx ^/users/[a-zA-Z0-9_\-]+/inbox$" \
