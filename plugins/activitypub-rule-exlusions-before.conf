# OWASP CRS Plugin
# Plugin name: activitypub-rule-exclusion-plugin
# Plugin description: Rule Exclusion plugin to allow list legit activitypub traffic.
# Rule ID block base: 9,532,000 (range is 1000, thus ID block base +1000)
# Plugin version: 1.0.0

# Generic rule to disable plugin
SecRule TX:activitypub-rule-exclusion-plugin_enabled "@eq 0" "id:9500099,phase:1,pass,nolog,ctl:ruleRemoveById=9500100-9500999"

# rule 9,532,000 - 9,532,999 : Detect ARGS activitypub-rule-exclusion-plugin-test-parameter and trigger alert if hit
SecRule ARGS:activitypub-rule-exclusion-plugin-test-parameter "@rx ." \
	"id:9500100,\
	phase:2,\
	block,\
	t:none,\
	msg:'Detected presence of parameter activitypub-rule-exclusion-plugin-test-parameter',\
	logdata:'%{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
	tag:'application-multi',\
	tag:'language-multi',\
	tag:'platform-multi',\
	tag:'attack-protocol',\
	tag:'paranoia-level/1',\
	tag:'OWASP_CRS',\
	tag:'capec/FIXME',\
	tag:'activitypub-rule-exclusion-plugin',\
        ver:'activitypub-rule-exclusion-plugin/1.0.0',\
	severity:'CRITICAL',\
	setvar:'tx.anomaly_score_pl1=+%{tx.critical_anomaly_score}'"
